# Resource entry point: environment/resources.yaml
# Bundled files are relative to this directory.
skill: ../SKILL.md
version: "1.1.0"
install: 无需安装；依赖 Python 3.9+ 标准库与 pypdf（>=4，纯 Python，无外部二进制）
source: 随 Skill 附带，无外部下载；样例 PDF 由包内脚本生成
conditions: 需可写工作目录；输入为一份有文字层的 PDF（单栏/双栏/带线表格；中英文均可）；不联网；不做 OCR
resources:
  - ../examples/call.md
  - ../examples/make_two_column.py
  - ../examples/make_cases.py
  - ../rules/parse_rules.md
  - ../run.py
  - ../scripts/layout.py
  - ../scripts/pdfparse.py
  - ../scripts/tables.py
  - ../SKILL.md

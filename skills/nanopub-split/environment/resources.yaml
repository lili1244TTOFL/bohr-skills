# Resource entry point: environment/resources.yaml
# Bundled files are relative to this directory.
skill: ../SKILL.md
version: "1.1.0"
install: 无需安装；依赖 Python 3.9+ 标准库（零第三方依赖、零模型请求）
source: 随 Skill 附带，无外部下载；示例正文由包内提供
conditions: 需可写工作目录；输入为一份含正文的 .md/.txt（可带 case.json 提供来源与 output_contract）；不联网；不做 OCR
resources:
  - ../examples/call.md
  - ../examples/case/case.json
  - ../examples/case/manuscript.md
  - ../examples/samples_20.md
  - ../GITHUB_URL.txt
  - ../rules/relations.md
  - ../run.py
  - ../SKILL.md
